<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bgSeo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7d4"/>
      <stop offset="1" stop-color="#f5f1e4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bgSeo)"/>
  <circle cx="500" cy="110" r="80" fill="#ffffff" opacity="0.3"/>
  <circle cx="120" cy="380" r="90" fill="#ffffff" opacity="0.3"/>

  <!-- browser card with bars -->
  <rect x="160" y="130" width="270" height="200" rx="14" fill="#ffffff"/>
  <rect x="160" y="130" width="270" height="34" rx="14" fill="#0A0A0A"/>
  <circle cx="180" cy="147" r="6" fill="#e8622c"/>
  <circle cx="200" cy="147" r="6" fill="#fee17c"/>
  <circle cx="220" cy="147" r="6" fill="#f5f1e4"/>

  <rect x="190" y="240" width="24" height="60" fill="#dfe7d4"/>
  <rect x="230" y="210" width="24" height="90" fill="#fee17c"/>
  <rect x="270" y="180" width="24" height="120" fill="#e8622c"/>
  <rect x="310" y="220" width="24" height="80" fill="#fee17c"/>
  <rect x="350" y="195" width="24" height="105" fill="#e8622c"/>

  <!-- magnifying glass -->
  <g transform="translate(410 260)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#0A0A0A" stroke-width="18"/>
    <line x1="50" y1="50" x2="105" y2="105" stroke="#0A0A0A" stroke-width="22" stroke-linecap="round"/>
    <path d="M-25 -5 l14 14 30-30" fill="none" stroke="#e8622c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
