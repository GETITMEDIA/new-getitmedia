<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bgAds" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7d4"/>
      <stop offset="1" stop-color="#f5f1e4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bgAds)"/>
  <circle cx="520" cy="100" r="80" fill="#ffffff" opacity="0.3"/>
  <circle cx="110" cy="380" r="90" fill="#ffffff" opacity="0.3"/>

  <!-- megaphone -->
  <g transform="translate(150 180) rotate(-8)">
    <path d="M0 40 L140 0 L140 140 L0 100 Z" fill="#e8622c"/>
    <rect x="140" y="20" width="90" height="80" rx="12" fill="#0A0A0A"/>
    <path d="M230 20 L300 -20 L300 140 L230 100 Z" fill="#0A0A0A"/>
    <rect x="-30" y="55" width="35" height="30" rx="6" fill="#fee17c"/>
    <path d="M10 100 L30 165 L60 155 L45 95 Z" fill="#fee17c"/>
  </g>

  <!-- sound / broadcast waves -->
  <g stroke="#0A0A0A" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M470 90 q30 40 0 80"/>
    <path d="M505 70 q55 60 0 120"/>
  </g>

  <!-- ad bubble -->
  <g transform="translate(450 300)">
    <rect x="0" y="0" width="150" height="90" rx="18" fill="#ffffff"/>
    <path d="M20 90 L20 120 L55 90 Z" fill="#ffffff"/>
    <text x="75" y="55" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#e8622c" text-anchor="middle">AD</text>
  </g>
</svg>
