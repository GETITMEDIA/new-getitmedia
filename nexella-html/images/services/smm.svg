<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <defs>
    <linearGradient id="bgSmm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe7d4"/>
      <stop offset="1" stop-color="#f5f1e4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#bgSmm)"/>
  <circle cx="530" cy="120" r="80" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="360" r="90" fill="#ffffff" opacity="0.3"/>

  <!-- phone -->
  <rect x="255" y="90" width="150" height="300" rx="24" fill="#0A0A0A"/>
  <rect x="270" y="120" width="120" height="220" rx="6" fill="#f5f1e4"/>
  <circle cx="330" cy="360" r="10" fill="#f5f1e4"/>

  <!-- chat bubble -->
  <g transform="translate(140 150)">
    <rect x="0" y="0" width="120" height="80" rx="18" fill="#e8622c"/>
    <path d="M20 80 L20 108 L52 80 Z" fill="#e8622c"/>
    <circle cx="30" cy="40" r="8" fill="#fff"/>
    <circle cx="60" cy="40" r="8" fill="#fff"/>
    <circle cx="90" cy="40" r="8" fill="#fff"/>
  </g>

  <!-- heart bubble -->
  <g transform="translate(420 250)">
    <circle cx="45" cy="45" r="55" fill="#fee17c"/>
    <path d="M45 68c-20-14-30-26-30-40 0-11 9-19 19-19 7 0 12 3 11 12 0-9 4-12 11-12 10 0 19 8 19 19 0 14-10 26-30 40z" fill="#0A0A0A"/>
  </g>

  <!-- share bubble -->
  <g transform="translate(150 320)">
    <circle cx="35" cy="35" r="42" fill="#ffffff"/>
    <circle cx="20" cy="35" r="7" fill="#e8622c"/>
    <circle cx="48" cy="18" r="7" fill="#e8622c"/>
    <circle cx="48" cy="52" r="7" fill="#e8622c"/>
    <path d="M20 35 L48 18 M20 35 L48 52" stroke="#e8622c" stroke-width="4"/>
  </g>
</svg>
