</head><body style="margin:0"><!-- ===================== One Tool / 5 Solutions ===================== -->
      <section class="ot is-in theme-dark" id="one-tool">
        <span class="ot__grid" aria-hidden="true"></span>
        <span class="ot__vignette" aria-hidden="true"></span>

        <div class="ot__stage">

          <svg class="ot__art" viewBox="0 0 577 611" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <filter id="otGlow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="6" result="far"/>
                <feGaussianBlur stdDeviation="2" result="near"/>
                <feMerge>
                  <feMergeNode in="far"/>
                  <feMergeNode in="near"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="otGlowBig" x="-80%" y="-80%" width="260%" height="260%">
                <feGaussianBlur stdDeviation="14" result="far"/>
                <feGaussianBlur stdDeviation="4" result="near"/>
                <feMerge>
                  <feMergeNode in="far"/>
                  <feMergeNode in="near"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <radialGradient id="otBulbCore" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
                <stop offset="34%" stop-color="#ffd9bd" stop-opacity="0.7"/>
                <stop offset="70%" stop-color="#f36523" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#f36523" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="otHalo" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#f36523" stop-opacity="0.42"/>
                <stop offset="55%" stop-color="#c74a12" stop-opacity="0.16"/>
                <stop offset="100%" stop-color="#c74a12" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="otPlatFill" x1="288" y1="486" x2="288" y2="576" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#3a1608"/>
                <stop offset="1" stop-color="#140a05"/>
              </linearGradient>
              <radialGradient id="otReflect" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ff8a3d" stop-opacity="0.55"/>
                <stop offset="55%" stop-color="#f36523" stop-opacity="0.22"/>
                <stop offset="100%" stop-color="#f36523" stop-opacity="0"/>
              </radialGradient>
              <filter id="otBlurSoft" x="-40%" y="-200%" width="180%" height="500%">
                <feGaussianBlur stdDeviation="10"/>
              </filter>
              <radialGradient id="otPlatGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
                <stop offset="26%" stop-color="#ffcfa8" stop-opacity="0.6"/>
                <stop offset="64%" stop-color="#f36523" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#f36523" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- ambient halo behind the bulb -->
            <circle class="ot-halo" cx="290" cy="366" r="146" fill="url(#otHalo)"/>

            <!-- ---------- connectors ---------- -->
            <g class="ot-wires" stroke="#f36523" stroke-width="1.4" fill="none" filter="url(#otGlow)"
               stroke-linecap="round" stroke-linejoin="round">
              <!-- 01 upper-left -->
              <path class="ot-wire" pathLength="1" d="M44 150 L44 232 L170 232"/>
              <path class="ot-wire" pathLength="1" d="M182 240 L246 316"/>
              <!-- 02 top centre -->
              <path class="ot-wire" pathLength="1" d="M212 194 L212 250 Q212 258 220 258 L336 258 Q344 258 344 250 L344 214"/>
              <path class="ot-wire" pathLength="1" d="M240 266 L240 284 L268 308"/>
              <!-- 03 upper-right -->
              <path class="ot-wire" pathLength="1" d="M540 150 L540 232 L414 232"/>
              <path class="ot-wire" pathLength="1" d="M402 240 L336 316"/>
              <!-- 04 lower-left -->
              <path class="ot-wire" pathLength="1" d="M18 334 L18 408 L128 408"/>
              <path class="ot-wire" pathLength="1" d="M140 412 L246 434"/>
              <!-- 05 lower-right -->
              <path class="ot-wire" pathLength="1" d="M556 336 L556 408 L448 408"/>
              <path class="ot-wire" pathLength="1" d="M436 412 L334 434"/>
            </g>

            
            <g class="ot-sparks" stroke="#ffd9bd" stroke-width="2.4" fill="none"
               stroke-linecap="round" filter="url(#otGlow)">
              <path pathLength="1" style="--d:0s"    d="M182 240 L246 316"/>
              <path pathLength="1" style="--d:0.55s" d="M240 266 L240 284 L268 308"/>
              <path pathLength="1" style="--d:1.1s"  d="M402 240 L336 316"/>
              <path pathLength="1" style="--d:1.65s" d="M140 412 L246 434"/>
              <path pathLength="1" style="--d:2.2s"  d="M436 412 L334 434"/>
            </g>

            <!-- connector nodes -->
            <g class="ot-dots" fill="#08080a" stroke="#f36523" stroke-width="1.6" filter="url(#otGlow)">
              <circle cx="176" cy="235" r="4.6"/>
              <circle cx="240" cy="261" r="4.6"/>
              <circle cx="408" cy="235" r="4.6"/>
              <circle cx="134" cy="410" r="4.6"/>
              <circle cx="442" cy="410" r="4.6"/>
            </g>

            <ellipse class="ot-reflect" cx="288" cy="584" rx="215" ry="15"
                     fill="url(#otReflect)" filter="url(#otBlurSoft)" opacity="0.5"/>
            <!-- ---------- platform ---------- -->
            <g filter="url(#otGlow)">
              <path d="M138 486 L438 486 C454 486 464 494 472 504 L520 554 C530 564 523 574 511 574
                       L65 574 C53 574 46 564 56 554 L104 504 C112 494 122 486 138 486 Z"
                    fill="url(#otPlatFill)" stroke="#ff8a3d" stroke-width="2.2"/>
              <g stroke="#f36523" stroke-width="0.9" opacity="0.5">
                <path d="M184 487 L132 573"/>
                <path d="M238 487 L212 573"/>
                <path d="M288 487 L288 573"/>
                <path d="M338 487 L364 573"/>
                <path d="M392 487 L444 573"/>
                <path d="M122 512 L454 512"/>
                <path d="M94 542 L482 542"/>
              </g>
            </g>
            <!-- platform light pool -->
            <ellipse class="ot-pool" cx="288" cy="530" rx="86" ry="26" fill="url(#otPlatGlow)"/>
            <ellipse cx="288" cy="530" rx="44" ry="13" fill="none" stroke="#ffd9bd"
                     stroke-width="1.6" opacity="0.85" filter="url(#otGlow)"/>
            <ellipse cx="288" cy="530" rx="15" ry="4.6" fill="#ffffff" opacity="0.95" filter="url(#otGlow)"/>

            <!-- ---------- light bulb ---------- -->
            <g filter="url(#otGlowBig)">
              <!-- inner illumination -->
              <circle class="ot-core" cx="290" cy="362" r="46" fill="url(#otBulbCore)"/>
              <!-- glass -->
              <path d="M262 414 C244 403 234 386 234 366 C234 335 259 310 290 310
                       C321 310 346 335 346 366 C346 386 336 403 318 414 L318 428 L262 428 Z"
                    fill="none" stroke="#ff8a3d" stroke-width="2.2"/>
              <!-- filament -->
              <g stroke="#ffd9bd" stroke-width="1.7" fill="none" stroke-linecap="round">
                <path d="M272 414 L272 374 C272 358 283 350 290 350 C297 350 308 358 308 374 L308 414"/>
                <path d="M290 350 L290 414"/>
                <path d="M281 362 L281 414"/>
                <path d="M299 362 L299 414"/>
              </g>
              <!-- screw base -->
              <g stroke="#ff8a3d" stroke-width="2" fill="none" stroke-linejoin="round">
                <path d="M262 430 L318 430 L318 439 L262 439 Z"/>
                <path d="M264 442 L316 442 L316 451 L264 451 Z"/>
                <path d="M266 454 L314 454 L314 462 L266 462 Z"/>
                <path d="M274 465 L306 465 L302 473 L278 473 Z"/>
              </g>
            </g>
          </svg>

          <h2 class="ot__title" data-aos="fade-up">
            <span class="ot__title-main">One Tool</span>
            <span class="ot__title-accent"><i>5 Solutions</i></span>
          </h2>

          <div class="ot-node ot-node--left ot-node--1">
            <span class="ot-num">01</span>
            <p class="ot-lab">Technical<br>SEO</p>
          </div>

          <div class="ot-node ot-node--left ot-node--2">
            <span class="ot-num">02</span>
            <p class="ot-lab">Page<br>Optimization</p>
          </div>

          <div class="ot-node ot-node--right ot-node--3">
            <span class="ot-num">03</span>
            <p class="ot-lab">Performance<br>Improvements</p>
          </div>

          <div class="ot-node ot-node--left ot-node--4">
            <span class="ot-num">04</span>
            <p class="ot-lab">Keyword<br>Structure</p>
          </div>

          <div class="ot-node ot-node--right ot-node--5">
            <span class="ot-num">05</span>
            <p class="ot-lab">Lead<br>Generation<br>Website</p>
          </div>

        </div>
      </section>
      </section>
